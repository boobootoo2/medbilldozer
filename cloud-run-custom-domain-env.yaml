# Use this AFTER setting up app.medbilldozer.com in Vercel
#
# To apply: gcloud run services update medbilldozer-api --region=us-central1 --env-vars-file=cloud-run-custom-domain-env.yaml

ALLOWED_ORIGINS: "https://medbilldozer.com,https://www.medbilldozer.com,http://localhost:3000,http://localhost:5173"
ENVIRONMENT: "production"
